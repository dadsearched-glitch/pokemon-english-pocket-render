<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Four-device relay proof</title><style>body{font:18px system-ui;max-width:750px;margin:30px auto;padding:20px}button,input{font:inherit;padding:12px;margin:6px}pre{white-space:pre-wrap}</style><h1>4-device server relay proof</h1><p>Local testing only · authenticated WebSocket relay · no profile storage.</p><button id="create">Create room</button><input id="code" aria-label="Room code" maxlength="6"><button id="join">Join room</button><div id="members"></div><button id="send">Send test action</button><pre id="status"></pre><pre id="received"></pre><script type="module">
import {PeerRoom} from './multiplayer-transport.js';
let room;const status=document.querySelector('#status'),members=document.querySelector('#members'),received=document.querySelector('#received');
function render(){status.textContent=JSON.stringify({code:room.code,self:room.id,host:room.isHost,connected:room.connected().length},null,2);members.replaceChildren();for(const p of room.members||[])if(room.isHost&&!p.accepted){const b=document.createElement('button');b.textContent='Accept '+p.id.slice(0,6);b.onclick=()=>room.accept(p.id);members.append(b);}}
async function open(code){room=new PeerRoom({onchange:render,onerror:e=>{status.textContent=e;},onmessage:(id,m)=>{received.textContent+='Received '+JSON.stringify(m)+'\n';if(room.isHost)room.broadcast({echo:m,from:id});}});try{await room.open(code);document.querySelector('#create').disabled=true;document.querySelector('#join').disabled=true;}catch(e){status.textContent=e.message;}}
document.querySelector('#create').onclick=()=>open();document.querySelector('#join').onclick=()=>open(document.querySelector('#code').value);document.querySelector('#send').onclick=()=>{const m={action:'test',at:Date.now()};room.isHost?room.broadcast(m):room.send(room.host,m);};
</script></html>
